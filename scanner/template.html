<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Put Spread Scanner</title>
<style>
:root{
  --bg:#131722;--panel:#1E222D;--panel2:#262B38;--line:#363A45;--text:#E6E8EE;--muted:#9598A1;
  --bull:#1D9E75;--bear:#E24B4A;--warn:#EF9F27;--accent:#4C8DF6;
  --bull-bg:rgba(29,158,117,.16);--bear-bg:rgba(226,75,74,.16);--warn-bg:rgba(239,159,39,.16);
}
@media (prefers-color-scheme: light){
  :root{--bg:#F6F7F9;--panel:#FFFFFF;--panel2:#F0F2F5;--line:#DDE0E6;--text:#1B1F29;--muted:#6B7080;
    --bull:#0F8A63;--bear:#C9302F;--warn:#B86E00;--accent:#2F6FE0;
    --bull-bg:rgba(15,138,99,.12);--bear-bg:rgba(201,48,47,.10);--warn-bg:rgba(184,110,0,.12);}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1500px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-size:22px;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
select,input[type=search],button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tile .v{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .v small{font-size:13px;color:var(--muted);font-weight:500}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tab{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;padding:10px 14px;color:var(--muted);white-space:nowrap}
.tab.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.tab .n{background:var(--panel2);border-radius:20px;padding:1px 7px;font-size:12px;margin-left:5px}
.filters{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:10px;font-size:13px}
.filters label{display:flex;gap:6px;align-items:center;color:var(--muted);cursor:pointer}
.filters .sp{flex:1}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--panel2);font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none}
th:hover{color:var(--text)}th.on{color:var(--text)}
th.l,td.l{text-align:left}
tbody tr.row{cursor:pointer}tbody tr.row:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:none}
.tk{font-weight:700}.nm{color:var(--muted);font-size:12px;max-width:170px;overflow:hidden;text-overflow:ellipsis;display:block}
.good{color:var(--bull)}.bad{color:var(--bear)}.warn{color:var(--warn)}.mut{color:var(--muted)}
.b{display:inline-block;font-size:11px;font-weight:600;border-radius:5px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.b.buy{background:var(--bull-bg);color:var(--bull)}.b.exit{background:var(--bear-bg);color:var(--bear)}
.b.w{background:var(--warn-bg);color:var(--warn)}.b.m{background:var(--panel2);color:var(--muted)}
.score{display:inline-flex;gap:2px}.score i{width:7px;height:14px;border-radius:2px;background:var(--line)}
.score i.on{background:var(--bull)}
.det td{background:var(--panel2);text-align:left;white-space:normal;padding:14px 16px}
.dgrid{position:sticky;left:16px;width:min(1400px,calc(100vw - 72px));display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 24px}
.dgrid h4{margin:0 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kv{display:flex;justify-content:space-between;gap:10px;padding:2px 0;font-variant-numeric:tabular-nums}
.kv span:first-child{color:var(--muted)}
.chk{padding:2px 0}.chk b{display:inline-block;width:18px}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.empty{padding:40px;text-align:center;color:var(--muted)}
.guide{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 22px 18px;max-width:900px}
.guide h3{margin:18px 0 6px;font-size:15px}.guide p,.guide li{color:var(--text)}.guide td,.guide th{text-align:left;white-space:normal}
.guide table{margin:6px 0}
.foot{color:var(--muted);font-size:12px;margin-top:18px}
.demo{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div id="demo"></div>
  <header>
    <div>
      <h1>Trend Timing · Spread Scanner</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <label class="sub" for="month">Report</label>
      <select id="month"></select>
    </div>
  </header>

  <div class="tiles" id="tiles"></div>

  <div class="tabs" id="tabs"></div>
  <div id="view"></div>

  <div class="foot" id="foot"></div>
</div>

<script>
const D = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n = (x, d = 2) => x == null ? "—" : Number(x).toLocaleString("en-GB", {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = (x, d = 1, sign = false) => x == null ? "—" : (sign && x > 0 ? "+" : "") + n(x, d) + "%";
const big = x => x == null ? "—" : x >= 1e6 ? n(x / 1e6, 1) + "M" : x >= 1e3 ? n(x / 1e3, 1) + "k" : n(x, 0);
const usd = (x, d = 2) => x == null ? "—" : (x < 0 ? "−$" : "$") + n(Math.abs(x), d);
const strike = x => x == null ? "—" : (Number.isInteger(x) ? x : n(x, 1));
const fmtDate = s => s ? new Date(s + "T12:00:00").toLocaleDateString("en-GB", {day: "numeric", month: "short"}) : "—";

const CHECK_TXT = {
  credit: `Credit ≥ ${D.config.min_credit_pct}% of width`,
  iv_hv: `IV ≥ ${D.config.min_iv_hv}× 30-day realised vol (premium is rich)`,
  no_earnings: "No earnings before expiry",
  strike_vs_sma: "Short strike on the safe side of the 10-mo average",
  liquidity: `Short OI ≥ ${D.config.min_short_oi} and bid-ask ≤ ${D.config.max_bidask_pct}%`,
  not_near: `Price not within ${D.config.warn_pct}% of the average`,
};

// ── state ──
const S = {
  tab: "put",
  sort: {put: ["opt_volume", -1], call: ["opt_volume", -1], board: ["dist_pct", -1]},
  f: {q: "", earn: true, near: true, liquid: false, score: 0, type: "all", fresh: false},
  open: null,
};

// ── columns ──
const scoreBar = s => `<span class="score" title="${s}/6 checks passed">${[...Array(6)].map((_, i) => `<i class="${i < s ? "on" : ""}"></i>`).join("")}</span>`;
const flags = t => [
  t.fresh_buy ? '<span class="b buy">NEW BUY</span>' : "",
  t.fresh_exit ? '<span class="b exit">NEW EXIT</span>' : "",
  t.near ? '<span class="b w" title="Price is near the 10-month average">⚠ near line</span>' : "",
  t.earnings ? `<span class="b w" title="Earnings ${t.earnings} before expiry">📅 earnings ${fmtDate(t.earnings)}</span>` : "",
  t.exdiv ? `<span class="b m" title="Ex-dividend ${t.exdiv} before expiry">ex-div ${fmtDate(t.exdiv)}</span>` : "",
  t.stale_quotes ? '<span class="b m" title="One leg had no live bid/ask — mid uses last price">stale quote</span>' : "",
].join("");

const TCOLS = [
  {k: "rank", l: "#", f: (t, i) => `<span class="mut">${i + 1}</span>`, nosort: 1},
  {k: "ticker", l: "Ticker", c: "l", f: t => `<span class="tk">${esc(t.ticker)}</span><span class="nm">${esc(t.name)}</span>`},
  {k: "score", l: "Score", c: "l", f: t => scoreBar(t.score), tip: "Quality checks passed (click a row for detail)"},
  {k: "opt_volume", l: "Opt volume", f: t => `<b>${big(t.opt_volume)}</b>`, tip: "Total call + put contracts traded today in the chosen expiry"},
  {k: "spot", l: "Price", f: t => n(t.spot)},
  {k: "dist_pct", l: "vs 10-mo avg", f: t => `<span class="${t.near ? "warn" : t.dist_pct >= 0 ? "good" : "bad"}">${pct(t.dist_pct, 1, true)}</span>`, tip: "Last monthly close vs the 10-month average"},
  {k: "dte", l: "Expiry", f: t => `${fmtDate(t.expiry)} <span class="mut">${t.dte}d</span>`},
  {k: "short_strike", l: "Short / Long", f: t => `<b>${strike(t.short_strike)}</b> / ${strike(t.long_strike)}`},
  {k: "short_delta", l: "Δ short", f: t => n(Math.abs(t.short_delta), 2), sv: t => Math.abs(t.short_delta), tip: "Short strike delta (target 0.15–0.20)"},
  {k: "credit", l: "Credit", f: t => usd(t.credit), tip: "Mid-price credit per share (×100 per contract)"},
  {k: "credit_pct", l: "Cr / Width", f: t => `<span class="${t.checks.credit ? "good" : "mut"}">${pct(t.credit_pct, 0)}</span>`},
  {k: "ror", l: "Return on risk", f: t => pct(t.ror, 0)},
  {k: "pop", l: "POP", f: t => pct(t.pop, 0), tip: "Probability of profit: chance price finishes past breakeven (implied-vol based)"},
  {k: "theta", l: "Θ / day", f: t => `<span class="good">${usd(t.theta)}</span>`, tip: "Time decay earned per day, per contract"},
  {k: "vega", l: "Vega", f: t => usd(t.vega), tip: "P/L per +1 vol point, per contract (negative = hurt by rising IV)"},
  {k: "atm_iv", l: "IV", f: t => pct(t.atm_iv, 0)},
  {k: "iv_hv", l: "IV / HV", f: t => `<span class="${t.checks.iv_hv ? "good" : "mut"}">${n(t.iv_hv, 2)}×</span>`, tip: "At-the-money IV ÷ 30-day realised vol. >1 = options priced rich"},
  {k: "hv_rank", l: "HV rank", f: t => n(t.hv_rank, 0), tip: "Where today's 30-day realised vol sits in its 1-year range (0–100)"},
  {k: "sigma_dist", l: "σ away", f: t => n(t.sigma_dist, 2), tip: "Short strike distance in expected moves (1.0 = one standard deviation)"},
  {k: "strike_vs_sma", l: "Strike vs avg", f: t => `<span class="${t.checks.strike_vs_sma ? "good" : "warn"}">${pct(t.strike_vs_sma, 1, true)}</span>`, tip: "Short strike vs the 10-month average. Put spreads: below is better"},
  {k: "short_oi", l: "OI short", f: t => big(t.short_oi)},
  {k: "bidask_pct", l: "Bid-ask", f: t => `<span class="${t.bidask_pct != null && t.bidask_pct <= D.config.max_bidask_pct ? "" : "warn"}">${pct(t.bidask_pct, 0)}</span>`, tip: "Short leg bid-ask spread as % of mid"},
  {k: "flags", l: "Flags", c: "l", f: flags, nosort: 1},
];
const BCOLS = [
  {k: "ticker", l: "Ticker", c: "l", f: t => `<span class="tk">${esc(t.ticker)}</span>`},
  {k: "name", l: "Name", c: "l", f: t => `<span class="mut">${esc(t.name)}</span>`},
  {k: "sector", l: "Sector", c: "l", f: t => `<span class="mut">${esc(t.sector)}</span>`},
  {k: "in_market", l: "Signal", c: "l", f: t => t.in_market ? '<span class="b buy">● IN MARKET</span>' : '<span class="b m">○ IN CASH</span>'},
  {k: "fresh", l: "This month", c: "l", sv: t => t.fresh_buy ? 2 : t.fresh_exit ? 1 : 0,
    f: t => (t.fresh_buy ? '<span class="b buy">NEW BUY</span>' : "") + (t.fresh_exit ? '<span class="b exit">NEW EXIT</span>' : "") + (t.near ? '<span class="b w">⚠ near line</span>' : "")},
  {k: "month_close", l: "Month close", f: t => n(t.month_close)},
  {k: "sma", l: "10-mo avg", f: t => n(t.sma)},
  {k: "dist_pct", l: "vs avg", f: t => `<span class="${t.near ? "warn" : t.dist_pct >= 0 ? "good" : "bad"}">${pct(t.dist_pct, 1, true)}</span>`},
  {k: "spot", l: "Price now", f: t => n(t.spot)},
];

// ── filtering / sorting ──
function tradeRows(kind) {
  const f = S.f, q = f.q.trim().toUpperCase();
  return D.trades.filter(t => t.kind === kind
    && (!q || t.ticker.includes(q) || String(t.name).toUpperCase().includes(q))
    && (!f.earn || !t.earnings)
    && (!f.near || kind === "call" || !t.near)
    && (!f.liquid || t.checks.liquidity)
    && t.score >= f.score
    && (f.type === "all" || (f.type === "etf") === !!t.is_etf)
    && (!f.fresh || t.fresh_buy || t.fresh_exit));
}
function sortRows(rows, cols, [k, dir]) {
  const c = cols.find(c => c.k === k) || {};
  const v = c.sv || (t => t[k]);
  return [...rows].sort((a, b) => {
    const x = v(a), y = v(b);
    if (x == null) return 1; if (y == null) return -1;
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * dir;
  });
}

// ── rendering ──
function header() {
  $("#sub").innerHTML = `Signal from the <b>${esc(D.signal_month)}</b> monthly close · scanned ${new Date(D.generated).toLocaleString("en-GB", {dateStyle: "medium", timeStyle: "short"})} New York time · risk-free ${n(D.risk_free, 2)}%`;
  $("#month").innerHTML = D.months.map(m => `<option value="${m}" ${m === D.month ? "selected" : ""}>${new Date(m + "-15").toLocaleDateString("en-GB", {month: "long", year: "numeric"})}</option>`).join("");
  $("#month").onchange = e => location.href = e.target.value + ".html";
  const c = D.counts;
  $("#tiles").innerHTML = [
    ["In the market", `${c.in_market}<small> / ${D.scanned}</small>`],
    ["Fresh BUY signals", `<span class="good">${c.fresh_buy}</span>`],
    ["Fresh EXIT signals", `<span class="bad">${c.fresh_exit}</span>`],
    ["Put spread ideas", c.puts],
    ["Call spread ideas", c.calls],
  ].map(([k, v]) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
  if (D.demo) $("#demo").innerHTML = '<div class="demo">DEMO — synthetic data for layout testing only. Not real prices.</div>';
  $("#foot").innerHTML = `Education only, not advice. Quotes are delayed snapshots from Yahoo Finance at scan time — always check live prices with your broker before trading. ${D.errors.length ? `${D.errors.length} tickers failed to load.` : ""}`;
}

function tabs() {
  const T = [["put", "Put spreads", D.counts.puts], ["call", "Call spreads (fresh EXIT)", D.counts.calls], ["board", "Signal board", D.board.length], ["guide", "How to read"]];
  $("#tabs").innerHTML = T.map(([k, l, c]) => `<button class="tab ${S.tab === k ? "on" : ""}" data-t="${k}">${l}${c != null ? `<span class="n">${c}</span>` : ""}</button>`).join("");
  $("#tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => { S.tab = b.dataset.t; S.open = null; draw(); });
}

function filterBar(kind) {
  const f = S.f;
  return `<div class="filters">
    <input type="search" id="q" placeholder="Search ticker or name" value="${esc(f.q)}" style="width:200px">
    <label><input type="checkbox" data-f="earn" ${f.earn ? "checked" : ""}> Hide earnings before expiry</label>
    ${kind === "put" ? `<label><input type="checkbox" data-f="near" ${f.near ? "checked" : ""}> Hide ⚠ near the line</label>` : ""}
    <label><input type="checkbox" data-f="liquid" ${f.liquid ? "checked" : ""}> Liquid only</label>
    <label><input type="checkbox" data-f="fresh" ${f.fresh ? "checked" : ""}> New signals only</label>
    <label>Min score <select id="score">${[0, 1, 2, 3, 4, 5, 6].map(s => `<option ${s == f.score ? "selected" : ""}>${s}</option>`).join("")}</select></label>
    <label><select id="type"><option value="all">Stocks + ETFs</option><option value="stock" ${f.type === "stock" ? "selected" : ""}>Stocks</option><option value="etf" ${f.type === "etf" ? "selected" : ""}>ETFs</option></select></label>
    <span class="sp"></span>
    <button id="csv">⬇ CSV</button>
  </div>`;
}

function detail(t) {
  const kv = (k, v) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`;
  const leg = t.kind === "put" ? "P" : "C";
  return `<tr class="det"><td colspan="${TCOLS.length}"><div class="dgrid">
    <div><h4>Trade</h4>
      ${kv("Sell", `${strike(t.short_strike)}${leg} @ ${usd(t.short_mid)}`)}
      ${kv("Buy", `${strike(t.long_strike)}${leg} @ ${usd(t.long_mid)}`)}
      ${kv("Expiry", `${t.expiry} (${t.dte} days)${t.monthly ? " · monthly" : ""}`)}
      ${kv("Credit (mid / natural)", `${usd(t.credit)} / ${usd(t.credit_natural)}`)}
      ${kv("Max profit / loss per contract", `<span class="good">${usd(t.max_profit, 0)}</span> / <span class="bad">${usd(t.max_loss, 0)}</span>`)}
      ${kv("Breakeven", n(t.breakeven))}
    </div>
    <div><h4>Greeks &amp; odds (per contract)</h4>
      ${kv("Short / long delta", `${n(t.short_delta)} / ${n(t.long_delta)}`)}
      ${kv("Position delta", `${n(t.pos_delta, 1)} shares`)}
      ${kv("Theta", `${usd(t.theta)} / day`)}
      ${kv("Vega", `${usd(t.vega)} per vol pt`)}
      ${kv("Probability of profit", pct(t.pop, 0))}
      ${kv("Expected move to expiry", `±${usd(t.exp_move)} · short strike ${n(t.sigma_dist, 2)}σ away`)}
    </div>
    <div><h4>Volatility &amp; signal</h4>
      ${kv("ATM IV / short-strike IV", `${pct(t.atm_iv, 0)} / ${pct(t.short_iv, 0)}`)}
      ${kv("30-day realised vol", `${pct(t.hv30, 0)} · rank ${n(t.hv_rank, 0)}`)}
      ${kv("10-mo average", `${n(t.sma)} (price ${pct(t.dist_pct, 1, true)})`)}
      ${kv("Short strike vs average", pct(t.strike_vs_sma, 1, true))}
      ${kv("OI short / long", `${big(t.short_oi)} / ${big(t.long_oi)}`)}
      ${kv("Earnings / ex-div before expiry", `${t.earnings || "none"} / ${t.exdiv || "none"}`)}
    </div>
    <div><h4>Checks ${t.score}/6</h4>
      ${Object.entries(t.checks).map(([k, ok]) => `<div class="chk"><b class="${ok ? "good" : "bad"}">${ok ? "✓" : "✗"}</b>${CHECK_TXT[k]}</div>`).join("")}
      <div style="margin-top:10px">
        <a href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(t.ticker.replace("-", "."))}" target="_blank" rel="noopener">TradingView chart ↗</a> &nbsp;·&nbsp;
        <a href="https://finance.yahoo.com/quote/${encodeURIComponent(t.ticker)}/options" target="_blank" rel="noopener">Option chain ↗</a>
      </div>
    </div>
  </div></td></tr>`;
}

function table(rows, cols, sortKey, withDetail) {
  if (!rows.length) return `<div class="tbl"><div class="empty">No trades match these filters.</div></div>`;
  const [sk, sd] = sortKey;
  const th = cols.map(c => `<th class="${c.c || ""} ${c.k === sk ? "on" : ""}" data-k="${c.nosort ? "" : c.k}" ${c.tip ? `title="${esc(c.tip)}"` : ""}>${c.l}${c.k === sk ? (sd < 0 ? " ▾" : " ▴") : ""}</th>`).join("");
  const body = rows.map((t, i) => {
    const tr = `<tr class="row" data-id="${esc(t.ticker)}">${cols.map(c => `<td class="${c.c || ""}">${c.f(t, i)}</td>`).join("")}</tr>`;
    return tr + (withDetail && S.open === t.ticker ? detail(t) : "");
  }).join("");
  return `<div class="tbl"><table><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function guide() {
  return `<div class="guide">
  <h3>What this is</h3>
  <p>On the first trading day of each month the scanner checks every S&amp;P 500 stock and the main ETFs against the <b>Faber 10-month average</b> (same rule as your Trend Timing indicator, using the last <i>completed</i> month). Tickers <b>in the market</b> get a bull put spread idea. Tickers that just gave an <b>EXIT</b> get a bear call spread idea. The list is sorted by option volume — most liquid first.</p>
  <h3>How each spread is built</h3>
  <ul>
    <li><b>Expiry:</b> ${D.config.dte[0]}–${D.config.dte[1]} days, standard monthly (3rd Friday) preferred.</li>
    <li><b>Short strike:</b> closest to 0.175 delta (range ${D.config.delta[0]}–${D.config.delta[1]}).</li>
    <li><b>Long strike:</b> one width further out — $1 under $40, $2.50 to $100, $5 to $250, $10 to $600, $20 above.</li>
    <li><b>Prices:</b> mid of bid/ask. The "natural" credit (sell at bid, buy at ask) is the worst case.</li>
  </ul>
  <h3>The six checks (score)</h3>
  <table><tbody>${Object.values(CHECK_TXT).map((t, i) => `<tr><td>${i + 1}</td><td>${t}</td></tr>`).join("")}</tbody></table>
  <h3>Reading the numbers</h3>
  <ul>
    <li><b>POP</b> — rough chance the trade makes money at expiry. Uses implied vol, so it is the market's view, not a guarantee.</li>
    <li><b>Cr / Width</b> — credit as % of the spread width. Below ~20% the risk/reward is usually poor.</li>
    <li><b>IV / HV</b> — above 1.0 means options cost more than recent real movement: you are paid a premium for selling.</li>
    <li><b>σ away</b> — how many expected moves the short strike sits from the price. ~1.0σ ≈ 16 delta.</li>
    <li><b>Strike vs avg</b> — if the short strike is <i>below</i> the 10-month average, the trend signal should flip to EXIT before the spread is tested.</li>
    <li><b>Θ / Vega</b> — daily time decay you collect, and how much a 1-point rise in IV hurts.</li>
  </ul>
  <h3>Suggested management (from the indicator's stance)</h3>
  <ul>
    <li>Take profit at ~50% of the credit. Close or roll at 21 days left.</li>
    <li>Size so max loss per trade is 1–2% of the account.</li>
    <li>If the ticker gives an <b>EXIT</b> signal, close its put spreads.</li>
    <li>Avoid holding through earnings unless that is deliberate.</li>
  </ul>
  <h3>Limits</h3>
  <p>True IV Rank needs a history of implied vol, which free data doesn't give — <b>IV/HV</b> and <b>HV rank</b> are used instead. Quotes are snapshots at scan time and move quickly. Education only, not advice.</p>
  </div>`;
}

function csv(rows, cols) {
  const keys = ["ticker", "name", "kind", "score", "opt_volume", "spot", "dist_pct", "expiry", "dte", "short_strike", "long_strike", "short_delta", "credit", "credit_natural", "credit_pct", "ror", "pop", "theta", "vega", "atm_iv", "iv_hv", "hv_rank", "sigma_dist", "strike_vs_sma", "short_oi", "bidask_pct", "earnings", "exdiv", "fresh_buy", "near"];
  const lines = [keys.join(",")].concat(rows.map(r => keys.map(k => JSON.stringify(r[k] ?? "")).join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\n")], {type: "text/csv"}));
  a.download = `spreads-${D.month}.csv`; a.click();
}

function draw() {
  tabs();
  const v = $("#view");
  if (S.tab === "guide") { v.innerHTML = guide(); return; }
  if (S.tab === "board") {
    const q = S.f.q.trim().toUpperCase();
    const rows = sortRows(D.board.filter(t => !q || t.ticker.includes(q) || String(t.name).toUpperCase().includes(q)), BCOLS, S.sort.board);
    v.innerHTML = `<div class="filters"><input type="search" id="q" placeholder="Search ticker or name" value="${esc(S.f.q)}" style="width:200px"></div>` + table(rows, BCOLS, S.sort.board, false);
  } else {
    const rows = sortRows(tradeRows(S.tab), TCOLS, S.sort[S.tab]);
    const total = D.trades.filter(t => t.kind === S.tab).length;
    const note = `<div class="sub" style="margin:0 0 8px">Showing <b>${rows.length}</b> of ${total} ideas${rows.length < total ? " — the rest are hidden by the filters above" : ""} · click a row for full detail</div>`;
    v.innerHTML = filterBar(S.tab) + note + table(rows, TCOLS, S.sort[S.tab], true);
    $("#csv").onclick = () => csv(rows);
    v.querySelectorAll("[data-f]").forEach(el => el.onchange = () => { S.f[el.dataset.f] = el.checked; draw(); });
    $("#score").onchange = e => { S.f.score = +e.target.value; draw(); };
    $("#type").onchange = e => { S.f.type = e.target.value; draw(); };
    v.querySelectorAll("tr.row").forEach(tr => tr.onclick = () => { S.open = S.open === tr.dataset.id ? null : tr.dataset.id; draw(); });
  }
  const q = $("#q");
  q.oninput = () => { S.f.q = q.value; const p = q.selectionStart; draw(); const n2 = $("#q"); n2.focus(); n2.setSelectionRange(p, p); };
  const key = S.tab === "board" ? "board" : S.tab;
  v.querySelectorAll("th[data-k]").forEach(th => th.dataset.k && (th.onclick = () => {
    const [k, d] = S.sort[key];
    S.sort[key] = [th.dataset.k, k === th.dataset.k ? -d : -1];
    draw();
  }));
}

header(); draw();
</script>
