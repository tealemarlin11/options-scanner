name: Monthly spread scan

on:
  schedule:
    # 18:30 UTC on days 1–7 = during US market hours all year.
    # The script only runs once per month: on the first of these days the market is open.
    - cron: "30 18 1-7 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run now even if this month is already done"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency: scan

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scanner
        run: python -m scanner.scan ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}

      - name: Save report
        run: |
          git config user.name  "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No new report."; exit 0; fi
          git commit -m "Scan $(date -u +%Y-%m)"
          git push

      - name: Email me (opens an Issue)
        if: hashFiles('summary.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          { echo "📊 **Full report:** $URL"; echo; cat summary.md; } > body.md
          gh issue create --title "Spread scan — $(date -u +'%B %Y')" --body-file body.md
