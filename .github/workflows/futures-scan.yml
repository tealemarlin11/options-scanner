name: Monthly futures scan

on:
  schedule:
    - cron: "15 7 1-7 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run now even if this month is already done"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency: scan

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run futures scanner
        run: python -m futures.scan ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}

      - name: Save report
        run: |
          git config user.name  "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No new report."; exit 0; fi
          git commit -m "Futures scan $(date -u +%Y-%m)"
          git pull --rebase
          git push

      - name: Email me (opens an Issue)
        if: hashFiles('futures/summary.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/futures/"
          { echo "📈 **Full report:** $URL"; echo; cat futures/summary.md; } > body.md
          gh issue create --title "Futures signals — $(date -u +'%B %Y')" --body-file body.md
